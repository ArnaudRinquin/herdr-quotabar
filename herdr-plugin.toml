id = "quotabar.tabbar"
name = "Quotabar"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "AI plan quotas (Claude: 5h / 7d / per-model) as one compact line in the tab bar (or the spaces sidebar), plus a detail popup. Provider-pluggable."
platforms = ["macos", "linux"]

[[actions]]
id = "start"
title = "Quotabar: start sidebar monitor"
contexts = ["workspace"]
command = ["python3", "quota.py", "ensure"]

[[actions]]
id = "stop"
title = "Quotabar: stop sidebar monitor"
contexts = ["workspace"]
command = ["python3", "quota.py", "stop"]

[[actions]]
id = "refresh"
title = "Quotabar: refresh now"
contexts = ["workspace"]
command = ["python3", "quota.py", "once"]


[[panes]]
id = "usage"
title = "Quotabar"
placement = "popup"
width = "70%"
height = "40%"
command = ["python3", "quota.py", "popup"]
