id = "arnaud.quota"
name = "AI quota"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "AI plan quotas (Claude: 5h / 7d / per-model) as a compact Vibe-Island-style line in the spaces sidebar, plus a detail popup. Provider-pluggable."
platforms = ["macos", "linux"]

[[actions]]
id = "start"
title = "AI quota: start monitor"
contexts = ["workspace"]
command = ["python3", "quota.py", "ensure"]

[[actions]]
id = "stop"
title = "AI quota: stop monitor"
contexts = ["workspace"]
command = ["python3", "quota.py", "stop"]

[[actions]]
id = "refresh"
title = "AI quota: refresh now"
contexts = ["workspace"]
command = ["python3", "quota.py", "once"]

[[events]]
on = "workspace.created"
command = ["python3", "quota.py", "ensure"]

[[events]]
on = "pane.created"
command = ["python3", "quota.py", "ensure"]

[[panes]]
id = "usage"
title = "AI quota"
placement = "popup"
width = "70%"
height = "40%"
command = ["python3", "quota.py", "popup"]
